name: Consulta
on:
  push:
    branches: [consulta]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Estadísticas
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
        run: |
          sleep 150
          curl -sS -H "x-alert-secret: $ALERT_SECRET" "$SITE_URL/api/buscar?kind=carta&estados=vendido&clave=%25%7C%3F%7C%25&n=1000" > q.json
          python3 -c "
          import json,collections
          r=json.load(open('q.json'))['resultados']
          print('::notice title=sin coleccion::', len(r))
          ts=[x['title'][:70] for x in r]
          for i in range(0,min(len(ts),120),12): print('::notice title=t'+str(i)+'::'+' ||| '.join(ts[i:i+12]))
          "
          curl -sS -m 280 -H "x-alert-secret: $ALERT_SECRET" "$SITE_URL/api/stats" > s.json
          python3 - <<'PY'
          import json
          j=json.load(open('s.json'))
          def n(t,v): print(f"::notice title={t}::{json.dumps(v,ensure_ascii=False)[:1400]}")
          n('total',j.get('total')); n('vendidos_7d',j.get('vendidos_7d')); n('nuevos_24h',j.get('nuevos_24h'))
          n('ref_cartas',j.get('referencias_cartas')); n('ref_autografos',j.get('referencias_autografos'))
          n('alertas_7d',j.get('alertas_7d'))
          est={k:v for k,v in j.get('por_plataforma_tipo_estado',{}).items() if 'vendido' in k}
          n('vendidos_total',est)
          PY
