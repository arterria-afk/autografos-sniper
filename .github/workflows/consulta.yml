name: Consulta
on:
  push:
    branches: [consulta]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recheck (tras publicar Vercel)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
        run: |
          sleep 150
          out=$(curl -sS -X POST -H "x-alert-secret: $ALERT_SECRET" "$SITE_URL/api/recheck" | tr '\n%' '  ')
          echo "::notice title=recheck::${out:0:3800}"
