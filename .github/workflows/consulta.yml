name: Consulta
on:
  push:
    branches: [consulta]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Re-evaluar todo lo guardado (tras publicar Vercel)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
        run: |
          sleep 150
          out=$(curl -sS -m 300 -X POST -H "x-alert-secret: $ALERT_SECRET" "$SITE_URL/api/recheck")
          echo "::notice title=recheck::$(echo "$out" | head -c 1500)"
          for p in leo-messi michael-jordan eminem quentin-tarantino; do
            n=$(curl -sS -H "x-alert-secret: $ALERT_SECRET" "$SITE_URL/api/buscar?personaje=$p&kind=autografo&estados=activo,subasta,vendido&n=1000" | python3 -c "
          import json,sys,collections
          j=json.load(sys.stdin); it=j.get('resultados') or []
          c=collections.Counter(x.get('tipo') for x in it)
          print(len(it), dict(c))")
            echo "::notice title=$p::$n"
          done
