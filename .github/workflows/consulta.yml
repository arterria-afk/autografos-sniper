name: Consulta
on:
  push:
    branches: [consulta]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Estado
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
        run: |
          h=$(curl -sS "$SITE_URL/api/health" | python3 -c "import json,sys;print(json.dumps(json.load(sys.stdin)['migraciones']))")
          echo "::notice title=migraciones::$h"
          e=$(curl -sS -X POST -H "x-alert-secret: $ALERT_SECRET" "$SITE_URL/api/ebay-sold?n=1" | tr '\n%' '  ')
          echo "::notice title=ebay-sold::${e:0:1000}"
          out=$(curl -sS -H "x-alert-secret: $ALERT_SECRET" "$SITE_URL/api/stats" | python3 -c "import json,sys;d=json.load(sys.stdin);print(json.dumps({k:d[k] for k in ['vendidos_7d','referencias_cartas','referencias_autografos','alertas_7d']}))" | tr '\n%' '  ')
          for i in 0 1; do [ -n "${out:$((i*3800)):1}" ] && echo "::notice title=stats-$i::${out:$((i*3800)):3800}"; done
