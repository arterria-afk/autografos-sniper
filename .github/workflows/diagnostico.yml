name: Diagnóstico Vinted
on:
  push:
    branches: [diagnostico]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Entrada de anuncios y eBay
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
        run: |
          a=$(curl -sS -X POST -H "x-alert-secret: $ALERT_SECRET" -H "content-type: application/json" -d '{"items":[],"mode":"sweep"}' "$SITE_URL/api/vinted" | tr '\n%' '  ')
          echo "::notice title=api-vinted::${a:0:800}"
          b=$(curl -sS -X POST -H "x-alert-secret: $ALERT_SECRET" -H "content-type: application/json" -d '{"q":"messi topps","mercado":"EBAY_ES"}' "$SITE_URL/api/ebay" | tr '\n%' '  ')
          echo "::notice title=api-ebay::${b:0:800}"
