name: Diagnóstico Vinted
on:
  push:
    branches: [diagnostico]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Estado de la web (espera a que Vercel publique)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          sleep 150
          out=$(curl -sS "$SITE_URL/api/health" | tr '\n%' '  ')
          echo "::notice title=health::${out:0:3900}"
