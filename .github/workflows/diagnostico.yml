name: Diagnóstico Vinted
on:
  push:
    branches: [diagnostico]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Claves y prueba real de eBay
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
        run: |
          h=$(curl -sS "$SITE_URL/api/health" | tr '\n%' '  ')
          echo "::notice title=health::${h:0:1500}"
          for q in "Leo Messi topps|EBAY_ES|25" "Lamine Yamal topps|EBAY_GB|25" "Michael Jordan signed|EBAY_US|0"; do
            IFS='|' read -r texto mercado min <<< "$q"
            r=$(curl -sS -X POST -H "x-alert-secret: $ALERT_SECRET" -H "content-type: application/json" \
              -d "{\"q\":\"$texto\",\"mercado\":\"$mercado\",\"min\":$min}" "$SITE_URL/api/ebay" | tr '\n%' '  ')
            echo "::notice title=ebay $mercado $texto::${r:0:1500}"
          done
