name: Diagnóstico Vinted
on:
  push:
    branches: [diagnostico]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/diagnostico.mjs
      - name: Recheck de lo guardado (tras publicar Vercel)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
        run: |
          sleep 150
          out=$(curl -sS --fail-with-body -X POST -H "x-alert-secret: $ALERT_SECRET" "$SITE_URL/api/recheck" | tr '\n%' '  ')
          echo "::notice title=recheck::${out:0:3900}"
