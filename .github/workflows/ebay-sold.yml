name: eBay ventas
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
concurrency:
  group: ebay-sold
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ebay-sold.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
